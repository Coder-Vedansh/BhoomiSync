services:
  # ----------------------------------------------------------------------------
  # BhoomiSync Processing Engine Microservice (FastAPI + AI Workers)
  # ----------------------------------------------------------------------------
  processing-engine:
    build: .
    container_name: bhoomisync-processing-engine
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - HOST=0.0.0.0
      - PORT=9000
      - ODM_ENABLED=true
      - ODM_URL=http://nodeodm:3000
      - TILE_SERVER_BASE_URL=http://localhost:9000/api/v1/engine/tiles
    volumes:
      - ./data:/app/data
    depends_on:
      - nodeodm

  # ----------------------------------------------------------------------------
  # OpenDroneMap Worker (Photogrammetry, DEM, DSM, Orthomosaic Reconstruction)
  # ----------------------------------------------------------------------------
  nodeodm:
    image: opendronemap/nodeodm:latest
    container_name: bhoomisync-nodeodm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - odm_data:/var/www/data

volumes:
  odm_data:
